<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI ฝ่ายบริหารอาคารสถานที่และสิ่งแวดล้อม</title>
<meta name="theme-color" content="#1d4ea2">
<style>
  html, body { margin: 0; height: 100%; background: #1d4ea2; font-family: 'Noto Sans Thai', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #1d4ea2; }
  #fallback {
    position: fixed; right: 12px; bottom: 12px; z-index: 2; display: none;
    background: #fff; color: #17302d; border-radius: 10px; padding: 10px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); font-size: 14px; max-width: 320px;
  }
  #fallback a { color: #0d6e68; font-weight: 600; }
  #fallback button { margin-left: 8px; border: 0; background: none; cursor: pointer; font-size: 16px; color: #5d716e; }
</style>
</head>
<body>
<iframe id="app" title="KPI ฝ่ายบริหารอาคารสถานที่และสิ่งแวดล้อม"
        allow="camera; clipboard-read; clipboard-write; fullscreen"
        allowfullscreen></iframe>

<div id="fallback">
  หน้าไม่ขึ้นหรือเข้าสู่ระบบ Google ไม่ได้?
  <a id="direct" href="#" target="_blank" rel="noopener">เปิดหน้าต่างใหม่</a>
  <button type="button" aria-label="ปิด" onclick="this.parentNode.style.display='none'">✕</button>
</div>

<script>
  /* ===== แก้บรรทัดนี้เป็นลิงก์ Web app ของคุณ (ลงท้าย /exec) ===== */
  var GAS_URL = 'https://script.google.com/macros/s/วาง_DEPLOYMENT_ID_ที่นี่/exec';

  // ส่งพารามิเตอร์จากลิงก์/QR (?sys= ?eq= ?code= ?mode=) ต่อให้ Apps Script
  var url = GAS_URL + (location.search || '');
  document.getElementById('app').src = url;
  document.getElementById('direct').href = url;

  // แสดงปุ่มสำรองหลัง 8 วินาที เผื่อเบราว์เซอร์บล็อกคุกกี้ของ Google ใน iframe
  setTimeout(function () { document.getElementById('fallback').style.display = 'block'; }, 8000);
</script>
</body>
</html>
